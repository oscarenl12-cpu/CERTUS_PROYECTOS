<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="estilos3.css"/><!--linkeado a css-->
    <a href="pagina_principal.html" target="_blank"></a>&emsp;
    <title>REGISTRO</title>

</head>
<body>
<div class="registro-container">
    <div class="registro-header">
      Regístrate en este sitio
    </div>
    <div class="registro-body">
      <form action="pagina_principal.html" method="post">
        <label for="usuario">Nombre de usuario:</label>
        <input type="text" id="usuario" name="usuario" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>

        <p>Recibirás confirmación del registro por correo electrónico.</p>

        <button target="_blank" type="submit">Registrarse</button>
      </form>
    </div>
  </div>
</body>
</html>
